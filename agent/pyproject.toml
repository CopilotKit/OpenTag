[project]
name = "opentag-research-agent"
version = "0.1.0"
description = "OpenTag Deep Research Agent — CopilotKit Deep Agents (LangGraph) over AG-UI"
requires-python = ">=3.12"
dependencies = [
  "ag-ui-langgraph>=0.0.23",
  "copilotkit>=0.1.76",
  "deepagents>=0.3.5",
  "fastapi>=0.115.14",
  "langchain>=1.2.4",
  "langchain-mcp-adapters>=0.3.0",
  "langchain-openai>=1.1.7",
  "python-dotenv>=1.2.1",
  "tavily-python>=0.3.0",
  "uvicorn[standard]>=0.40.0",
]

[dependency-groups]
dev = ["pytest>=8.0.0", "httpx>=0.27.0"]

[tool.setuptools]
py-modules = ["agent", "main", "tools"]

[tool.pytest.ini_options]
pythonpath = ["."]
