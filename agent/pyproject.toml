[project]
name = "opentag-agent"
version = "0.1.0"
description = "OpenTag on-call triage agent — CopilotKit Deep Agents (LangGraph) over AG-UI"
requires-python = ">=3.12"
dependencies = [
  "ag-ui-langgraph>=0.0.23",
  "copilotkit>=0.1.76",
  "deepagents>=0.3.5",
  "fastapi>=0.115.14",
  "langchain>=1.2.4",
  "langchain-mcp-adapters>=0.3.0",
  "langchain-openai>=1.1.7",
  "python-dotenv>=1.2.1",
  "tavily-python>=0.3.0",
  "uvicorn[standard]>=0.40.0",
]

[dependency-groups]
dev = ["pytest>=8.0.0", "httpx>=0.27.0"]

[tool.setuptools]
packages = ["prompts"]
py-modules = [
  "agent",
  "internal_sources",
  "main",
  "tools",
  "write_confirmation",
]

[tool.pytest.ini_options]
pythonpath = ["."]
