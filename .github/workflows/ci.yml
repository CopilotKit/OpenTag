name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # pnpm version comes from the `packageManager` field in package.json —
      # no `version` input needed here; that's the single source of truth.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # No `npx playwright install` here on purpose: every test that would need
      # a headless browser mocks the renderers (see the vi.mock in
      # app/tools/__tests__/render-tools.test.ts), so CI needs no Chromium.
      - run: pnpm install --frozen-lockfile

      - run: pnpm check-types

      - run: pnpm test
