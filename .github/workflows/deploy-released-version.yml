name: Deploy / released version

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Kite environment
        required: true
        type: choice
        options: [staging, prod, community]
      version:
        description: Exact GitHub Release, for example v0.2.0
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  resolve:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      agent_image: ${{ steps.manifest.outputs.agent_image }}
      runtime_image: ${{ steps.manifest.outputs.runtime_image }}
    steps:
      - name: Download and validate release manifest
        id: manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          gh release download "$RELEASE_VERSION" \
            --repo "$GITHUB_REPOSITORY" --pattern container-images.json
          test "$(jq -r .version container-images.json)" = "$RELEASE_VERSION"
          echo "agent_image=$(jq -r .images.agent.reference container-images.json)" >> "$GITHUB_OUTPUT"
          echo "runtime_image=$(jq -r .images.runtime.reference container-images.json)" >> "$GITHUB_OUTPUT"

  deploy:
    needs: resolve
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/deploy-aws.yml
    with:
      agent_image: ${{ needs.resolve.outputs.agent_image }}
      environment: ${{ inputs.environment }}
      github_environment: kite-${{ inputs.environment }}
      ref: ${{ github.sha }}
      runtime_image: ${{ needs.resolve.outputs.runtime_image }}
